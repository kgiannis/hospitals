name: Generate daily schedules

on:
  schedule:
    # Athens is UTC+2 (winter) / UTC+3 (summer). These two UTC times land
    # mid-morning Athens year-round, giving a same-day retry.
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch: {}

# `contents: write` for the schedule commit; the Pages permissions are for the
# deploy job, which calls pages.yml. A called workflow inherits the caller's
# permissions and cannot elevate them, so they must be granted here.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-schedules
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      exit_code: ${{ steps.gen.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Generate schedules
        id: gen
        run: |
          set +e
          uv run python scripts/generate_schedule.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_schedules/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update daily schedules ($(date -u +%Y-%m-%d))"
            git push
          fi

  # The push above is made with the default GITHUB_TOKEN, and GitHub does not
  # fire workflow triggers for such events. Without this call, pages.yml never
  # runs and the published site silently freezes at the last human push.
  deploy:
    needs: generate
    uses: ./.github/workflows/pages.yml

  # Kept separate from `generate` so a partial run — some dates written, today's
  # missing — still deploys what it managed to produce before turning the run red.
  report:
    needs: [generate, deploy]
    if: always() && needs.generate.outputs.exit_code != '0'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Today's schedule was not generated (see the generate job log)."
          exit 1
